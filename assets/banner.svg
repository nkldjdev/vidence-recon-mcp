<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-label="vidence-recon-mcp — authorized security recon over MCP, part of the Vidence project" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <!-- Vidence palette: bg #0d1117, surface #161b22, accent #3987e5, good #0ca30c, text #f0f6fc, muted #9198a1 -->
  <rect x="1" y="1" width="998" height="198" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.09)"/>
  <rect x="1" y="1" width="6" height="198" rx="3" fill="#3987e5"/>

  <!-- shield + check -->
  <g transform="translate(52,56)">
    <path d="M35 4 L66 14 L66 44 C66 70 52 82 35 90 C18 82 4 70 4 44 L4 14 Z"
          fill="rgba(57,135,229,0.12)" stroke="#3987e5" stroke-width="5" stroke-linejoin="round"/>
    <polyline points="19,46 31,59 52,31" fill="none" stroke="#0ca30c" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="92" font-size="50" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#3987e5">vidence</tspan><tspan fill="#f0f6fc">-recon-mcp</tspan>
  </text>

  <!-- tagline -->
  <text x="152" y="126" font-size="19" font-weight="600" fill="#f0f6fc">
    Authorized security recon &amp; OWASP playbooks, exposed over MCP.
  </text>
  <text x="152" y="152" font-size="15" font-weight="500" fill="#9198a1">
    Safe by design · detection-only · scope-gated · part of the Vidence project
  </text>

  <!-- EU / MIT pills -->
  <g transform="translate(792,150)" font-size="13" font-weight="700">
    <rect x="0" y="-18" width="74" height="26" rx="13" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="37" y="0" text-anchor="middle" fill="#9198a1">MIT</text>
    <rect x="84" y="-18" width="112" height="26" rx="13" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="140" y="0" text-anchor="middle" fill="#0ca30c">🇪🇺 EU-first</text>
  </g>
</svg>
